# Второй ответ технической поддержки вендора, 2026-09-28. Здесь другое, чем
# выше, основание: это **описания вендора**, а не наши замеры, и статус у них
# соответствующий — тип источника `official-doc` (тот же, что у первого ответа,
# см. `docs/evidence/sources.md`), который для статуса `verified` достаточен
# сам. Разбор — в спецификации
# `docs/superpowers/specs/2026-09-28-wire-level-and-coports.md`, §2.

- id: traceallports-order-is-not-a-contract
  claim: "Порядок объектов в ответе `traceallports` — не контракт: лист строится подъёмом по `ParentWire` до корневой линии (корень всегда первый), затем рекурсивным обходом в глубину (линия добавляется один раз, дочерние — в порядке индексов), затем сопряжениями с обоих концов; **для сложных топологий порядок не гарантирован**"
  status: verified
  source:
    type: official-doc
    ref: "docs/superpowers/specs/2026-09-28-wire-level-and-coports.md §2.1"
    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-28
  evidence: "Второй ответ технической поддержки вендора, 2026-09-28: «первым идёт источник входа» верно только для топологий **без служебных блоков**, а вендорский `export_1layer_topology` назван обработчиком частного случая, а не рабочим инструментом. Наше основание не отменяется и не подтверждается: взятое у вендора правило кратности берёт у входного порта первого соседа (`min(1, cols(peers))`), то есть порядок для него значим, а на топологии со служебными блоками это не проверялось (см. §4 спецификации)"
  tests: []

