# Реестр фактов о SimInTech и библиотеке simintech-api — схема v3.
#
# Зачем это нужно. Утверждения о среде живут в документах, спецификациях и
# комментариях — то есть в прозе, где «мы измерили» и «мы предполагаем»
# выглядят одинаково. Агент, действующий по такому тексту, не отличает факт от
# догадки, а человек не видит, что именно проверено и на какой версии. Здесь у
# каждого факта названы источник, версия и дата, а где есть автотест — и он.
#
# Статусы (v3; словарь один для всей базы знаний):
#   documented        — так написано в официальной документации (справка
#                       поставки, help.simintech.ru); сам код среды не звали;
#   code-confirmed    — следует из кода (нашего или вендорского); тест на
#                       фейке подтверждает контракт кода, НЕ поведение среды;
#   live-verified     — живой прогон / поставленный опыт / наблюдение выгрузки;
#   vendor-confirmed  — ответ технической поддержки вендора или листинг его
#                       исходника (то, чего нет ни в справке, ни в замерах);
#   hypothesis        — предположение, не проверенное ничем;
#   contradicted      — проверено и опровергнуто (хранится, чтобы вывод не
#                       «починили» обратно; обязано нести contradicted_by);
#   unknown           — не измерено; план проверки — в разделе 10 базы знаний.
#
# Правила (их держит `scripts/evidence.py`, он же гейт в CI):
#   * статус и источник обязаны сходиться: documented ← official-doc,
#     live-verified ← {live-com, controlled-experiment, xprt-observation},
#     vendor-confirmed ← vendor, code-confirmed ← source-code;
#   * производный документ (`derived-doc`: README, скиллы, журналы) —
#     НЕ доказательство: с ним допустимы только hypothesis / contradicted /
#     unknown. Повторение утверждения в README статус не повышает;
#   * тест на фейке (`unit-fake`) не может быть единственной опорой
#     `live-verified` — это статус `code-confirmed`;
#   * у `live-verified` и `vendor-confirmed` обязательны версия и дата
#     (`environment`), а также `reproduction` — как воспроизвести;
#   * ссылки `ref` репо-квалифицированы (`simintech-mcp/…`); локальные пути
#     (`docs/…`, `simintech_api/…`, …) обязаны существовать;
#   * id, названные в таблицах `docs/knowledge/**/*.md`, обязаны существовать.
#
# `docs/evidence/verification-matrix.md` и
# `docs/evidence/contradictions.md` генерируются из этого файла:
# `python scripts/evidence.py`. Правьте реестр, а не производные.

