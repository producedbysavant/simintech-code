  claim: "Семейство функций текста модели вендор называет из четырёх имён: `createmodel`, `createmodelfromfile`, `savemodeltofile`, `savemodeltotext`"
  status: verified
  source:
    type: official-doc
    ref: "docs/superpowers/specs/2026-09-28-wire-level-and-coports.md §2.7"
    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-28
  evidence: "Второй ответ технической поддержки вендора, 2026-09-28. В срезе справки (`simintech_api/data/language_functions.json`, v15.05.2026, 878 имён) нет ни одного из четырёх имён, но там нет и `savemodeltofile` с `createmodelfromfile`, которые отвечали живым вызовом, — поэтому реестр имён для этого семейства не источник ни в ту, ни в другую сторону"
  tests: []

