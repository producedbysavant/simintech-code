  claim: "`savemodeltotext` — то единственное имя семейства, которого мы не нашли в поставке 2.26.6.23"
  status: unknown
  source:
    type: source-code
    ref: "docs/superpowers/specs/2026-09-28-wire-level-and-coports.md §2.7"
    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-28
  evidence: "Расхождение с ответом вендора: он называет четыре функции, в поставке видны три. Сам поиск опирался на срез справки (`simintech_api/data/language_functions.json`, v15.05.2026, 878 имён) — ни одного из четырёх имён там нет, но нет и `savemodeltofile` с `createmodelfromfile`, которые отвечали живым вызовом (§1.6), — значит, отсутствие в реестре ничего не доказывает. Причина не локализована: либо функции нет в этой поставке, либо вендор назвал её иначе. Опираться на это имя в сценарии, пока расхождение не разрешено, не на чем"
  tests: []

