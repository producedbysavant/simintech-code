- id: traceallports-second-arg-crosses-container
  statement: '`traceallports(port, 1)` обходит сопряжённые порты **через границу контейнера**, а с `0` её не переходит'
  status: live-verified
  source:
    type: live-com
    ref: docs/superpowers/specs/2026-09-28-wire-level-and-coports.md §1.1
  environment:
    product: SimInTech64
    version: 2.26.6.23
    observed_at: '2026-09-28'
  reproduction: 'Опрашивался внешний порт блока «Субмодель» на родительской странице: вызов с `1` вернул внешний источник и два порта страницы субмодели — объект типа 103 («Блок-идентификатор порта») и внутренний блок (у обоих владелец по `getownercontainer` — контейнер субмодели); вызов с `0` — только внешнего соседа. В обратную сторону (опрос внутреннего порта) замер не делался. Вендорский `export_1layer_topology` зовёт функцию с `0`, то есть границу не переходит: её держит аргумент, а не среда'
  tests: []
