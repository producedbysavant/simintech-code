    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-28
  evidence: "Опрашивался внешний порт блока «Субмодель» на родительской странице: вызов с `1` вернул внешний источник и два порта страницы субмодели — объект типа 103 («Блок-идентификатор порта») и внутренний блок (у обоих владелец по `getownercontainer` — контейнер субмодели); вызов с `0` — только внешнего соседа. В обратную сторону (опрос внутреннего порта) замер не делался. Вендорский `export_1layer_topology` зовёт функцию с `0`, то есть границу не переходит: её держит аргумент, а не среда"
  tests: []

