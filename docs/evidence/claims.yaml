- id: wires-have-no-ends-via-com
  claim: "Концы линий через COM не читаются: нет ни методов для портов связи, ни координат (`Points` пуст даже после нормализации)"
  status: measured
  source:
    type: live-com
    ref: "docs/gap-closure-plan.md, Н3"
    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-17
  evidence: "`list_wires` отдаёт количество и идентификаторы; пара «откуда → куда» не восстанавливается — поэтому связь запоминает сам `connect`"
  tests: []

- id: findstartport-is-a-signal-resolver
  claim: "`findstartport` — не оракул электрической смежности: на спорных портах он вернул порт другого контейнера, а вендорский экспортёр его не вызывает вовсе"
  status: refuted
  source:
    type: controlled-experiment
    ref: "docs/roadmap-agentic-ecosystem.md, раздел 10 (2026-09-23)"
    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-23
  evidence: "Гипотеза «findstartport даёт непосредственное ребро» опровергнута: на трёх портах ответ противоречит эталону, а контракт связей в поставке строится на `traceallports` + `min(1, …)` для входов"
  tests: []

- id: conn-describes-wire-ends-pairwise
  claim: "`conn` описывает концы линии попарно (для k концов — C(k,2) рёбер), а не отдельные физические провода"
  status: verified
  source:
    type: controlled-experiment
    ref: "docs/roadmap-agentic-ecosystem.md, раздел 10.7 (2026-09-23)"
    product_version: "SimInTech64, поставка 2.26.6.23"
    observed_at: 2026-09-23
  evidence: "На развилке из одного выхода вендорская поставка даёт звезду, попарное правило — треугольник; различие воспроизведено живым тестом на трёх формах ветвления"
  tests:
    - file: tests/integration/test_topology_live.py
      id: test_vendor_cardinality_rule_makes_the_branch_a_star
      kind: live

